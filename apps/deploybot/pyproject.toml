[project]
name = "deploybot"
version = "0.2.1"
description = "The /aipostit Slack command: release, promote, roll back and status from #aipostit-deploys"
requires-python = ">=3.15,<3.16"
dependencies = [
    "httpx==0.28.1",
    "pyjwt[crypto]==2.15.1",
    "slack-bolt==1.30.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.uv]
package = false # an app, not a library: `app/` runs from the project directory

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"] # assert is how pytest checks; test tokens are fake

[tool.mypy]
python_version = "3.15"
strict = true

[[tool.mypy.overrides]]
module = ["slack_bolt", "slack_bolt.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
