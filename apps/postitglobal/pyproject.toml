[project]
name = "postitglobal"
version = "0.3.4"
description = "Hotel content: Claude drafts, DeepL translations, Buffer publishing"
requires-python = ">=3.15,<3.16"
# The versions requirements.txt pinned (platform plan 5.2), except two that the image scan
# refuses: FastAPI 0.115 brought Starlette 0.38.6, and python-multipart 0.0.9; both had
# fixable HIGH vulnerabilities. uv.lock pins the rest.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.33",
    "pydantic-settings==2.4.0",
    "supabase==2.33.0",
    "celery[redis]==5.6.3",
    "redis==8.1.0",
    "anthropic==2.3.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "prometheus-client==0.26.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "fakeredis>=2.40.0",
    "respx>=0.23.1",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false # an app, not a library: `app/` runs from the project directory

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "DTZ"]
ignore = ["B008"] # FastAPI's Depends()/Form()/File() defaults are the framework's idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest checks

[tool.mypy]
python_version = "3.15"
plugins = ["pydantic.mypy"]
# Not strict yet: the imported code wasn't type-checked. New modules and tests are checked;
# the modules below carried errors on import (platform plan 5.2) and come off this list as
# they are typed. Supabase returns JSON, not the dicts these modules promise.
[[tool.mypy.overrides]]
module = [
    "app.assets.service",
    "app.auth.dependencies",
    "app.auth.router",
    "app.auth.sessions",
    "app.content.service",
    "app.generation.claude",
    "app.hotels.service",
    "app.jobs.tasks",
    "app.publishing.buffer",
    "app.translation.deepl",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"] # no type hints published
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
