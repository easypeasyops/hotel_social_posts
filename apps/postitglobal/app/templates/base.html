<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}postitglobal{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

  <!-- Nav -->
  <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
    <a href="/dashboard/hotels"><img src="/static/logo.png" alt="postitglobal" width="142" height="32" class="h-8 w-auto" /></a>
    <div class="flex items-center gap-4 text-sm text-gray-600">
      <a href="/dashboard/hotels" class="hover:text-gray-900">Hotels</a>
      <form method="post" action="/logout">
        <button class="hover:text-gray-900" type="submit">Sign out</button>
      </form>
    </div>
  </nav>

  <!-- Flash messages -->
  {% if messages %}
  <div class="max-w-4xl mx-auto mt-4 px-6">
    {% for msg in messages %}
    <div class="rounded px-4 py-2 mb-2 text-sm
      {% if msg.type == 'error' %}bg-red-100 text-red-800
      {% else %}bg-green-100 text-green-800{% endif %}">
      {{ msg.text }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- Page content -->
  <main class="max-w-4xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
