{# The live checklist under a new password and its confirmation (ids password and
   password_confirmation): advice only, the server enforces the rules. #}
<ul id="password-checks" class="checks small" aria-live="polite">
  <li data-check="length">At least 8 characters</li>
  <li data-check="strength">Stronger with 12+ characters, or a mix of letters, numbers and symbols</li>
  <li data-check="match">Both passwords match</li>
</ul>
<script>
  const password = document.getElementById('password');
  const confirmation = document.getElementById('password_confirmation');
  function check() {
    const value = password ? password.value : '';
    const kinds = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^A-Za-z0-9]/].filter((re) => re.test(value)).length;
    const passed = {
      length: value.length >= 8,
      strength: value.length >= 12 || (value.length >= 8 && kinds >= 3),
      match: value.length > 0 && value === confirmation.value,
    };
    document.querySelectorAll('[data-check]').forEach((item) => {
      item.classList.toggle('ok', passed[item.dataset.check]);
    });
  }
  if (password) {
    password.addEventListener('input', check);
    confirmation.addEventListener('input', check);
  }
</script>
