# Pinned versions only stay safe if something bumps them. Dependabot opens PRs; CI
# (including the image scan and smoke test) decides whether they're safe to merge.
version: 2
updates:
  - package-ecosystem: uv
    directories: [/apps/aipostit, /apps/deploybot]
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates together, one PR a week. A major update (anthropic 0.x to
      # 2.x, redis 5 to 8) arrives in a PR of its own: it can break the code, and in a group
      # it blocked six harmless updates with it (#16).
      python-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions # bumps the pinned SHAs (and their # vX comments)
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The platform's reusable workflows move with platform.lock, in a PR of their own.
      # Dependabot names each by its path (easypeasyops/platform/.github/workflows/<file>),
      # so the exact name alone matched none of them (#189, #191).
      - dependency-name: easypeasyops/platform
      - dependency-name: easypeasyops/platform/*

  - package-ecosystem: docker # bumps the base image digests in the Dockerfiles
    directories: [/apps/aipostit, /apps/deploybot]
    schedule:
      interval: weekly
