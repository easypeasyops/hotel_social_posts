<div class="password">
  <input id="{{ name }}" name="{{ name }}" type="password" autocomplete="{{ autocomplete }}" required
         {% if minlength %}minlength="{{ minlength }}"{% endif %}{% if describedby %} aria-describedby="{{ describedby }}"{% endif %} />
  <button type="button" class="password-toggle" data-toggle="{{ name }}" aria-controls="{{ name }}" aria-pressed="false">Show</button>
</div>
