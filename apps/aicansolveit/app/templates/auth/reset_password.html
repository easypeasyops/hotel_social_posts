<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Reset password — aicansolveit</title>
  <style>
    body { font: 16px system-ui, sans-serif; color: #111827; background: #f9fafb; }
    main { box-sizing: border-box; width: min(100% - 2rem, 28rem); margin: 15vh auto; padding: 2rem; background: white; border: 1px solid #e5e7eb; border-radius: 0.75rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin: 1rem 0 0.35rem; }
    input { box-sizing: border-box; width: 100%; padding: 0.65rem; border: 1px solid #d1d5db; border-radius: 0.35rem; }
    button { width: 100%; margin-top: 1.25rem; padding: 0.7rem; color: white; background: #111827; border: 0; border-radius: 0.35rem; cursor: pointer; }
    .error { padding: 0.75rem; color: #991b1b; background: #fef2f2; border-radius: 0.35rem; font-size: 0.875rem; }
  </style>
</head>
<body>
  <main>
    <h1>Choose a new password</h1>
    <p>Use at least 8 characters.</p>
    {% if success %}
    <p role="status" style="padding: 0.75rem; color: #166534; background: #f0fdf4; border-radius: 0.35rem; font-size: 0.875rem;">{{ success }}</p>
    {% endif %}
    {% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}
    {% if success %}
    <p><a href="/login">Go to sign in</a></p>
    {% else %}
    <form method="post" action="/reset-password">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      <label for="password_confirmation">Confirm new password</label>
      <input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="8" required />
      <button type="submit">Update password</button>
    </form>
    {% endif %}
  </main>
</body>
</html>
