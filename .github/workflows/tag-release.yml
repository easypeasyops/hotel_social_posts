name: Tag release

# A merge to main that changes an app's version in apps/<app>/pyproject.toml tags that commit
# <app>/vX.Y.Z, which starts release.yml. The tag is made with the release app's token: a tag
# made with this workflow's own GITHUB_TOKEN would not start another workflow.
on:
  push:
    branches: [main]
    paths: ["apps/*/pyproject.toml"]

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: tag changed versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the push's first commit's parent, and the tags

      - name: Which versions changed
        id: versions
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version() { python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])'; }
          tags=""
          for file in $(git diff --name-only "$BEFORE" HEAD -- 'apps/*/pyproject.toml'); do
            app=$(cut -d/ -f2 <<<"$file")
            new=$(version <"$file")
            old=$(git show "$BEFORE:$file" 2>/dev/null | version 2>/dev/null || true) # a new app has none
            if [[ "$new" != "$old" ]] && ! git rev-parse -q --verify "refs/tags/$app/v$new" >/dev/null; then
              tags="$tags $app/v$new"
            fi
          done
          echo "tags=$tags" >>"$GITHUB_OUTPUT"
          echo "To tag:${tags:- nothing}"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.versions.outputs.tags != ''
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Tag the merge commit
        if: steps.versions.outputs.tags != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAGS: ${{ steps.versions.outputs.tags }}
        run: |
          for tag in $TAGS; do
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            echo "::notice::Tagged $tag: release.yml builds it"
          done
