name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the default GITHUB_TOKEN can write to the repo; CI only needs to read.
permissions:
  contents: read

# A new push to the same PR/branch cancels the now-stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only PRs skip the work in every job (apps/aipostit/scripts/ci-scope.sh).
  scope:
    name: change scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its first parent
      - name: Does this change need the checks?
        id: scope
        run: apps/aipostit/scripts/ci-scope.sh

  # The platform's reusable workflows, pinned to platform.lock's commit (keep them equal).
  check:
    needs: scope
    uses: easypeasyops/platform/.github/workflows/reusable-python-check.yml@07b1a9fea3f227dc8d1cf256ddb9b3b219c10e78 # platform.lock
    with:
      run: ${{ needs.scope.outputs.full == 'true' }}
      working-directory: apps/aipostit
      typecheck-paths: app tests
      # Where the imported code's tests start (platform plan 5.2); raised as tests come,
      # up to the platform's 90. (Python 3.15 stopped counting annotation-only lines, all
      # covered, as statements: the same tests read 3 points lower than on 3.12.)
      coverage-min: 66

  image:
    needs: scope
    uses: easypeasyops/platform/.github/workflows/reusable-image.yml@07b1a9fea3f227dc8d1cf256ddb9b3b219c10e78 # platform.lock
    with:
      run: ${{ needs.scope.outputs.full == 'true' }}
      context: apps/aipostit
      smoke-command: AIPOSTIT_IMAGE="$IMAGE" apps/aipostit/scripts/smoke.sh

  # deploybot (apps/deploybot/): the /aipostit Slack command. Its own checks and image, with
  # the platform's coverage minimum from the start.
  deploybot-check:
    needs: scope
    uses: easypeasyops/platform/.github/workflows/reusable-python-check.yml@07b1a9fea3f227dc8d1cf256ddb9b3b219c10e78 # platform.lock
    with:
      run: ${{ needs.scope.outputs.full == 'true' }}
      working-directory: apps/deploybot
      typecheck-paths: app tests
      coverage-min: 90

  deploybot-image:
    needs: scope
    uses: easypeasyops/platform/.github/workflows/reusable-image.yml@07b1a9fea3f227dc8d1cf256ddb9b3b219c10e78 # platform.lock
    with:
      run: ${{ needs.scope.outputs.full == 'true' }}
      context: apps/deploybot
      # It needs Slack to start; the smoke test is that the image imports its code.
      smoke-command: docker run --rm "$IMAGE" python -c "import app.main"

  # aipostit's deploy values (apps/aipostit/deploy/), rendered for each environment
  # with the platform's service chart as Argo CD will, and schema-checked. The chart is the
  # release the platform's apps/aipostit/envs/ pin: move CHART with them.
  deploy:
    name: deploy values
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHART: oci://ghcr.io/easypeasyops/charts/service@sha256:ca3d68b758d57577660a870180415210590c9ed299d80756102debb502d012f4 # 1.2.1
      CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce
      KUBECONFORM: ghcr.io/yannh/kubeconform:v0.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.full == 'true'
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: needs.scope.outputs.full == 'true'
        with:
          version: v4.3.1
      - name: Render each environment and validate it
        if: needs.scope.outputs.full == 'true'
        working-directory: apps/aipostit/deploy
        run: |
          # An env file without a release yet renders with a placeholder digest.
          placeholder="sha256:$(printf '0%.0s' {1..64})"
          for env_file in envs/*.yaml; do
            env=$(basename "$env_file" .yaml)
            digest=$(yq -r '.image.digest // ""' "$env_file")
            helm template aipostit "$CHART" --namespace "aipostit-$env" \
              --values service/values.yaml --values "$env_file" \
              --set "image.digest=${digest:-$placeholder}" \
              --kube-version 1.37.0 \
              --api-versions monitoring.coreos.com/v1/ServiceMonitor \
              --api-versions monitoring.coreos.com/v1/PodMonitor \
              --api-versions monitoring.coreos.com/v1/PrometheusRule >"/tmp/$env.yaml"
            echo "$env: $(grep -c '^kind:' "/tmp/$env.yaml") objects"
          done
          docker run --rm -v /tmp:/r:ro -w /r "$KUBECONFORM" -strict -summary \
            -kubernetes-version 1.37.0 -schema-location default \
            -schema-location "$CRDS/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            staging.yaml prod.yaml

  # The one required check: green only when every job above passed (or was skipped as
  # docs-only by its own input, which still reports success).
  gate:
    name: ci
    if: always()
    needs: [scope, check, image, deploy, deploybot-check, deploybot-image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
