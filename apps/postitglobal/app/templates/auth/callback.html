{% extends "auth/_layout.html" %}
{% block title %}Signing in{% endblock %}
{% block content %}
    <h1 id="heading">Email sign-in</h1>
    <p id="status" role="status" class="lead">Verifying your sign-in link…</p>
    <a id="login-link" hidden class="btn btn-secondary" href="/login">Return to sign in</a>
{% endblock %}
{% block scripts %}
  <script>
    const status = document.getElementById('status');
    const loginLink = document.getElementById('login-link');
    const params = new URLSearchParams(window.location.hash.slice(1));
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    const expiresInValue = params.get('expires_in');
    const expiresAtValue = params.get('expires_at');
    const expiresIn = expiresInValue ? Number(expiresInValue) : NaN;
    const expiresAt = expiresAtValue ? Number(expiresAtValue) : NaN;
    const flowType = params.get('type');
    const issuedAt = Math.floor(Date.now() / 1000);
    const error = params.get('error_description') || params.get('error');
    if (flowType === 'recovery') {
      document.getElementById('heading').textContent = 'Password recovery';
    }

    history.replaceState(null, '', window.location.pathname);

    async function completeSignIn() {
      if (error || !accessToken || !refreshToken) {
        throw new Error('This sign-in link is invalid or has expired.');
      }

      const callbackPath = flowType === 'recovery'
        ? '/auth/callback/recovery'
        : '/auth/callback/session';
      const response = await fetch(callbackPath, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          access_token: accessToken,
          refresh_token: refreshToken,
          flow_type: flowType,
          expires_at: Number.isFinite(expiresAt) && expiresAt > 0
            ? expiresAt
            : Number.isFinite(expiresIn) ? issuedAt + expiresIn : null,
        }),
      });

      if (!response.ok) {
        throw new Error(response.status === 401
          ? 'This sign-in link is invalid or has expired.'
          : response.status === 403
            ? "This account doesn't have access to postitglobal."
            : 'Sign-in is temporarily unavailable. Please try again.');
      }

      window.location.assign(response.url || '/dashboard/hotels');
    }

    completeSignIn().catch((err) => {
      status.textContent = err.message;
      status.className = 'alert alert-error';
      loginLink.hidden = false;
    });
  </script>
{% endblock %}
