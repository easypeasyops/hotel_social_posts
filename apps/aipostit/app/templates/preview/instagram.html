{%- set handle = (hotel.slug or hotel.name)|replace("-", "")|lower -%}
<figure data-preview="instagram" class="w-full max-w-sm overflow-hidden rounded-lg border border-gray-200 bg-white text-sm text-neutral-900 font-sans">
  <div class="flex items-center gap-2.5 px-3 py-2.5">
    <span class="grid h-8 w-8 flex-none place-items-center rounded-full bg-gradient-to-tr from-amber-400 via-pink-500 to-purple-600 p-[2px]">
      <span class="grid h-full w-full place-items-center rounded-full bg-white text-xs font-semibold">{{ hotel.name[:1]|upper }}</span>
    </span>
    <span class="font-semibold truncate">{{ handle }}</span>
    <span class="ml-auto text-lg leading-none" aria-hidden="true">⋯</span>
  </div>
  {% if images %}
  <div class="relative">
    <div class="flex aspect-square snap-x snap-mandatory overflow-x-auto bg-neutral-100 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
      {% for url in images %}<img src="{{ url }}" alt="" loading="lazy" class="h-full w-full flex-none snap-center object-cover" />{% endfor %}
    </div>
    {% if images|length > 1 %}
    <svg class="absolute right-3 top-3 h-5 w-5 text-white drop-shadow" viewBox="0 0 24 24" fill="currentColor" aria-label="{{ images|length }}"><path d="M7 3h11a3 3 0 0 1 3 3v11h-2V6a1 1 0 0 0-1-1H7z"/><rect x="3" y="7" width="14" height="14" rx="3"/></svg>
    {% endif %}
  </div>
  {% else %}
  <div class="grid aspect-square place-items-center bg-neutral-100 text-neutral-400">
    <svg class="h-12 w-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
  </div>
  {% endif %}
  <div class="flex items-center gap-4 px-3 pt-3" aria-hidden="true">
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-3.3-6.5A8 8 0 0 1 20 12zm0 0v8l-3-2"/></svg>
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m22 3-9.5 9.5M22 3l-6.5 18-3-8.5L4 9.5z"/></svg>
    <svg class="ml-auto h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-6-5-6 5z"/></svg>
  </div>
  <figcaption class="whitespace-pre-line px-3 pb-3 pt-2"><span class="font-semibold">{{ handle }}</span> {{ draft.body_tr }}</figcaption>
</figure>
