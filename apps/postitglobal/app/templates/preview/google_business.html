{#- A Google Business Profile update: one image (the first), then the text, as Google shows
    it on the hotel's profile. -#}
<figure data-preview="google_business" class="w-full max-w-sm overflow-hidden rounded-xl border border-gray-200 bg-white text-sm text-[#202124] font-sans">
  <div class="flex items-center gap-3 px-4 py-3">
    <span class="grid h-10 w-10 flex-none place-items-center rounded-full bg-[#1a73e8] font-semibold text-white">{{ hotel.name[:1]|upper }}</span>
    <span class="min-w-0">
      <span class="block font-medium truncate">{{ hotel.name }}</span>
      <span class="block text-xs text-[#5f6368]">Şimdi</span>
    </span>
  </div>
  {% if images %}
  <img src="{{ images[0] }}" alt="" loading="lazy" class="aspect-[4/3] w-full object-cover" />
  {% endif %}
  <figcaption class="whitespace-pre-line px-4 py-3">{{ draft.body_tr }}</figcaption>
  <div class="flex items-center justify-end border-t border-gray-100 px-4 py-2" aria-hidden="true">
    <svg class="h-5 w-5 text-[#5f6368]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.6M8.2 13.2l7.6 4.6"/></svg>
  </div>
</figure>
