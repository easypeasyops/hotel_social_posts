<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ hotel.name }}{% endblock %} — postitglobal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: {
        iris: { 50: '#f4f1fe', 100: '#e7e0fd', 600: '#3b05c1', 700: '#2f04a6', 950: '#030923' },
        sand: { 50: '#faf7f2', 100: '#f3ece1', 500: '#8a8178', 700: '#5c554f' },
      },
      fontFamily: { customer: ['Figtree', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      boxShadow: { soft: '0 1px 2px 0 rgba(3, 9, 35, 0.06), 0 8px 24px -8px rgba(3, 9, 35, 0.12)' },
    } } };
  </script>
</head>
<body class="min-h-screen bg-sand-50 text-iris-950 font-customer text-base">
  <header class="bg-white border-b border-sand-100">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <a href="/hotel" class="font-semibold text-lg tracking-tight truncate">{{ hotel.name }}</a>
      <form method="post" action="/logout">
        <button type="submit" class="min-h-11 px-3 rounded-lg text-sand-700 hover:text-iris-950 hover:bg-sand-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-iris-600">Çıkış yap</button>
      </form>
    </div>
  </header>
  <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
