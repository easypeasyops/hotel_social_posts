{%- set handle = (hotel.slug or hotel.name)|replace("-", "")|lower -%}
{#- TikTok's photo mode: a vertical frame the images swipe through, the actions down the
    right, the handle and caption over the bottom. -#}
<figure data-preview="tiktok" class="relative w-full max-w-[18rem] aspect-[9/16] overflow-hidden rounded-xl bg-black text-sm text-white font-sans">
  {% if images %}
  <div class="flex h-full snap-x snap-mandatory overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
    {% for url in images %}<img src="{{ url }}" alt="" loading="lazy" class="h-full w-full flex-none snap-center object-cover" />{% endfor %}
  </div>
  {% else %}
  <div class="grid h-full place-items-center text-neutral-600">
    <svg class="h-12 w-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
  </div>
  {% endif %}
  <div class="pointer-events-none absolute bottom-24 right-2 flex flex-col items-center gap-4 drop-shadow" aria-hidden="true">
    <span class="relative grid h-11 w-11 place-items-center rounded-full border-2 border-white bg-neutral-700 font-semibold">{{ hotel.name[:1]|upper }}<span class="absolute -bottom-2 grid h-5 w-5 place-items-center rounded-full bg-[#fe2c55] text-xs">+</span></span>
    <svg class="mt-2 h-8 w-8" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg>
    <svg class="h-8 w-8" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c5 0 9 3.4 9 7.6s-4 7.6-9 7.6c-.9 0-1.8-.1-2.6-.3L5 20l1-3.6C4.2 15 3 12.9 3 10.6 3 6.4 7 3 12 3z"/></svg>
    <svg class="h-8 w-8" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
    <svg class="h-8 w-8" viewBox="0 0 24 24" fill="currentColor"><path d="M13 4l8 7.5-8 7.5v-4.5c-5 0-8 1.5-10 5 .7-5.5 3.5-10 10-11z"/></svg>
  </div>
  {% if images|length > 1 %}
  <div class="pointer-events-none absolute inset-x-0 bottom-2 flex justify-center gap-1" aria-hidden="true">
    {% for url in images %}<span class="h-1 w-4 rounded-full bg-white/60"></span>{% endfor %}
  </div>
  {% endif %}
  <figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent px-3 pb-6 pt-10 pr-16">
    <span class="block font-semibold">@{{ handle }}</span>
    <span class="mt-1 whitespace-pre-line line-clamp-3">{{ draft.body_tr }}</span>
    <span class="mt-2 block truncate text-xs">♫ Orijinal ses · {{ handle }}</span>
  </figcaption>
</figure>
