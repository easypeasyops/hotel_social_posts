name: Release

# Releases per app (platform plan 3.5): an app lives in apps/<app>/ and is released from a
# <app>/vX.Y.Z tag as the image ghcr.io/<owner>/<repo>/<app>, which the platform's deploy gate
# and admission policy accept only with this workflow's provenance at that app's tag.
# The same workflow as easypeasyops/links' (one per domain repo; the platform's policy accepts
# any of our repos' release.yml, each for its own images only).
# Cut one:  bump `version` in apps/<app>/pyproject.toml (via PR) and merge: tag-release.yml
# pushes the tag (aipostit/vX.Y.Z) itself. By hand only if that failed:
#   git tag aipostit/v0.1.0 && git push origin aipostit/v0.1.0
# An app with a staging environment then gets its staging deploy PR, which merges itself when
# `ci` is green.
on:
  push:
    tags: ["*/v[0-9]+.[0-9]+.[0-9]+"] # `*` stops at `/`: exactly <app>/vX.Y.Z

permissions: {} # nothing by default; the job asks for exactly what it needs

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished release

jobs:
  release:
    name: build, scan, publish, attest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      app: ${{ steps.app.outputs.app }}
      version: ${{ steps.app.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to ghcr.io
      id-token: write # OIDC identity for keyless Sigstore signing of the attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag names the app and its version. One source of truth for the version: a tag
      # that disagrees with the app's pyproject.toml is a mistake (tagged the wrong commit,
      # forgot the bump), so stop before publishing.
      - name: Which app, and the tag must match its pyproject version
        id: app
        run: |
          app="${GITHUB_REF_NAME%%/v*}" tag="${GITHUB_REF_NAME##*/v}"
          # An app name the admission policy accepts in a tag: lowercase, digits and dashes.
          [[ "$app" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::$app is not a valid app name"; exit 1; }
          [[ -f "apps/$app/pyproject.toml" ]] || { echo "::error::no app apps/$app/ for tag $GITHUB_REF_NAME"; exit 1; }
          version=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "apps/$app/pyproject.toml")
          if [[ "$tag" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match apps/$app/pyproject.toml version $version"
            exit 1
          fi
          echo "app=$app" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/$app" >>"$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Gate: build and scan BEFORE anything is published. A release that fails the scan
      # never reaches the registry.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ steps.app.outputs.app }}
          load: true
          tags: ${{ steps.app.outputs.app }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.app.outputs.app }}:scan
          version: v0.70.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # 0.2.0 and 0.2 — no `latest`: deploys reference digests, and a moving `latest`
          # makes "what's running in prod?" unanswerable.
          # The tag is <app>/vX.Y.Z, not a bare semver: give the version itself.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.app.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.app.outputs.version }}

      # amd64 for servers/CI, arm64 for Apple Silicon laptops and Graviton/Ampere nodes.
      # SBOM + max provenance are attached to the image in the registry by BuildKit.
      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ steps.app.outputs.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      # Signed (Sigstore, keyless via this workflow's OIDC identity) statement of which
      # repo, commit, and workflow produced this exact digest. Verify with:
      #   gh attestation verify oci://ghcr.io/easypeasyops/hotel_social_posts/aipostit@<digest> --owner easypeasyops
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
          APP: ${{ steps.app.outputs.app }}
        run: |
          {
            echo "## Image"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Deploy by digest (immutable): set \`image.digest\` to \`${DIGEST}\` in"
            echo "apps/${APP}/deploy/envs/<env>.yaml, staging before prod (apps/${APP}/docs/RUNBOOK.md)."
            echo
            echo "Verify provenance:"
            echo
            echo '```bash'
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} --owner ${GITHUB_REPOSITORY_OWNER}"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes-file notes.md

  # The new image goes to staging: a PR with its digest, opened with the release app's token so
  # that its CI runs (one opened with GITHUB_TOKEN would never get its `ci` check).
  deploy-staging:
    name: open the staging deploy PR
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Open the PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP: ${{ needs.release.outputs.app }}
          VERSION: ${{ needs.release.outputs.version }}
          DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          if [[ ! -f "apps/$APP/deploy/envs/staging.yaml" ]]; then
            echo "::notice::$APP has no staging environment"
            exit 0
          fi
          .github/scripts/deploy-pr.sh "$APP" staging "$DIGEST" "$VERSION"
