# Prod, on the laptop cluster for now (platform plan 5, decided 2026-11-03), where Railway
# ran it before 5.9. Same image digest staging ran.
environment: prod
image:
  digest: "sha256:37cdcc89417ae53c39b828f50c8a394eabb6521d1d0b545a6c82d936de8fe300" # aipostit v0.4.0, as staging
gateway:
  hostnames: ["aipostit.localhost"]
config:
  publicBaseUrl: "http://aipostit.localhost:8080"
  sessionCookieSecure: "false" # the kind front door is plain HTTP
# Off until postitglobal-prod is gone: during the move from postitglobal both run against
# the same Supabase and Buffer, and only one may generate drafts and sync Buffer each hour.
cronJobs:
  generate-weekly: null
  sync-buffer: null
