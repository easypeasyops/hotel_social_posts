# Staging: the same chart and image digest prod will get, smaller. It uses prod's keys and
# Supabase (platform plan 5, decided): what it generates and publishes is real.
# The release this environment runs. Argo CD deploys whatever is here on main, so changing
# the digest in a merged PR IS the deploy; the first one lands with platform plan 5.9.
environment: staging
image:
  digest: "sha256:85071b5933b8bb9e89ced393c79453321975d70f66f7870ad02bf348a239b89b" # v0.3.7
replicaCount: 1
gateway:
  hostnames: ["staging.postitglobal.localhost"]
config:
  publicBaseUrl: "http://staging.postitglobal.localhost:8080"
  sessionCookieSecure: "false" # the kind front door is plain HTTP
  logLevel: DEBUG
  inviteEmail: "true" # SMTP_USERNAME and SMTP_PASSWORD are in the store (RUNBOOK)
# No weekly generation here: staging shares prod's Supabase, so its CronJob would generate
# every hotel's drafts a second time each week. To test generation in staging, queue one
# hotel: POST /internal/jobs/generate/<hotel_id> with the X-Cron-Secret header.
# Nor the Buffer sync: prod's already syncs the same rows, and both would spend the one
# Buffer quota.
cronJobs:
  generate-weekly: null
  sync-buffer: null
