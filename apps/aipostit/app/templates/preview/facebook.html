<figure data-preview="facebook" class="w-full max-w-md overflow-hidden rounded-lg border border-gray-200 bg-white text-[15px] text-[#050505] font-sans">
  <div class="flex items-center gap-2 px-4 pt-3">
    <span class="grid h-10 w-10 flex-none place-items-center rounded-full bg-[#1877f2] font-semibold text-white">{{ hotel.name[:1]|upper }}</span>
    <span class="min-w-0">
      <span class="block font-semibold truncate">{{ hotel.name }}</span>
      <span class="flex items-center gap-1 text-xs text-[#65676b]">Şimdi ·
        <svg class="h-3 w-3" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm4.9 6.2h-2.1a10.8 10.8 0 0 0-.9-3.8 5.6 5.6 0 0 1 3 3.8zM8 2.5c.6.8 1.2 2.3 1.4 4.7H6.6C6.8 4.8 7.4 3.3 8 2.5zM6.1 3.4c-.5 1-.8 2.4-.9 3.8H3.1a5.6 5.6 0 0 1 3-3.8zM3.1 8.8h2.1c.1 1.4.4 2.8.9 3.8a5.6 5.6 0 0 1-3-3.8zM8 13.5c-.6-.8-1.2-2.3-1.4-4.7h2.8c-.2 2.4-.8 3.9-1.4 4.7zm1.9-.9c.5-1 .8-2.4.9-3.8h2.1a5.6 5.6 0 0 1-3 3.8z"/></svg>
      </span>
    </span>
    <span class="ml-auto text-xl leading-none text-[#65676b]" aria-hidden="true">⋯</span>
  </div>
  <figcaption class="whitespace-pre-line px-4 py-3">{{ draft.body_tr }}</figcaption>
  {% if images %}
  {#- Facebook's grid: one full width, two side by side, three as one big and two under it,
      four or more as two by two with the rest counted on the last. -#}
  {%- set count = images|length -%}
  <div class="grid gap-0.5 {% if count > 1 %}grid-cols-2{% endif %}">
    {% for url in images[:4] %}
    <div class="relative {% if count == 3 and loop.first %}col-span-2{% endif %}">
      <img src="{{ url }}" alt="" loading="lazy" class="w-full object-cover {% if count == 1 %}max-h-[32rem]{% elif count == 3 and loop.first %}aspect-[2/1]{% else %}aspect-square{% endif %}" />
      {% if loop.index == 4 and count > 4 %}<span class="absolute inset-0 grid place-items-center bg-black/40 text-3xl font-semibold text-white">+{{ count - 4 }}</span>{% endif %}
    </div>
    {% endfor %}
  </div>
  {% endif %}
  <div class="mx-4 grid grid-cols-3 border-t border-gray-200 py-1 text-sm font-semibold text-[#65676b]" aria-hidden="true">
    <span class="flex items-center justify-center gap-1.5 py-1.5"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 10v11H3V10zm0 0 4-7a2 2 0 0 1 3 2l-1 4h6a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 21H7"/></svg>Beğen</span>
    <span class="flex items-center justify-center gap-1.5 py-1.5"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Yorum yap</span>
    <span class="flex items-center justify-center gap-1.5 py-1.5"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 5l7 7-7 7v-4c-5 0-8 1.5-10 5 .5-5 3-10 10-11z"/></svg>Paylaş</span>
  </div>
</figure>
