# Service level objectives for aipostit: the source of truth for its SLO rules.
#
# The platform's scripts/gen_slo_rules.py turns this file into
# deploy/service/slo-rules.values.yaml (committed, so reviewers see the real PromQL; CI fails
# if the two drift apart). From apps/aipostit, with a platform checkout at platform.lock's
# commit:
#
#   uv run --script <platform>/scripts/gen_slo_rules.py --spec deploy/prometheus/slos.yaml \
#     --values --out deploy/service/slo-rules.values.yaml
#
# An SLO is a promise about what users experience, measured at the service:
#   SLI  = good events / valid events          (what we measure)
#   SLO  = SLI target over a rolling window    (what we promise)
#   budget = 1 - SLO                           (how much failure we can afford)
#
# Valid events are requests to the app's own routes. Probes are left out (most of the
# traffic, and they always succeed), and so is `unmatched` (paths the app doesn't have:
# scanners, answered 404 at once). 4xx counts as good: the app answered. 5xx counts as bad.

window: 30d # burn-rate factors in the generator assume a 30-day window
# Where every SLO alert's runbook_url points.
runbook_url: https://github.com/easypeasyops/hotel_social_posts/blob/main/apps/aipostit/docs/RUNBOOK.md#slo-burn-rate-alerts

slos:
  - name: aipostit-availability
    description: The app answers without a server error
    objective: 0.995 # budget: 0.5% of requests, about 3.6 hours of full outage in 30 days
    sli:
      type: availability
      selector: 'job="aipostit", route!~"/healthz|/readyz|/health|unmatched"'

  - name: aipostit-latency
    description: The app answers in under 2.5 s
    objective: 0.99 # pages render in tens of milliseconds; Supabase round trips push some to 1 s
    sli:
      type: latency
      selector: 'job="aipostit", route!~"/healthz|/readyz|/health|unmatched"'
      threshold_seconds: 2.5 # must be a histogram bucket edge (app/observability.py)
