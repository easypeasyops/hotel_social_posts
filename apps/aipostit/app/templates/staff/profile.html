{% extends "staff/base.html" %}
{% block title %}Profiliniz{% endblock %}
{% block content %}
<div>
  <a href="/hotel" class="text-sm font-medium text-iris-600 underline">← Dosyalarınız</a>
  <h1 class="mt-2 text-2xl font-semibold tracking-tight">Profiliniz</h1>
</div>

<section class="bg-white border border-sand-100 rounded-2xl shadow-soft p-5 sm:p-8">
  <dl class="grid gap-4 sm:grid-cols-[10rem_1fr]">
    <dt class="font-medium">Ad soyad</dt>
    <dd class="text-sand-700">{{ name or "Henüz eklenmedi" }}</dd>
    <dt class="font-medium">E-posta</dt>
    <dd class="text-sand-700 break-all">{{ email }}</dd>
    <dt class="font-medium">Otel</dt>
    <dd class="text-sand-700">{{ hotel.name }}</dd>
    <dt class="font-medium">Rol</dt>
    <dd class="text-sand-700">{{ role }}</dd>
  </dl>
</section>
{% endblock %}
